# Настройки проверки AIGate. Скопируйте этот файл в config.ini и заполните.
# config.ini не попадает в git: в нём ключ доступа.

[aigate]
# Адрес LLM API AIGate, тот же, что у OpenAI-совместимых клиентов (без /v1).
# Для AIGate-client: http://127.0.0.1:18787 (мост запускается командой aigate bridge start).
url = https://aigate.example.ru

# Ключ приложения LLM-интеграции из консоли AIGate.
# Для AIGate-client: AIGATE_API_KEY из ~/.aigate/env/aigate-env.sh.
# Можно оставить пустым и задать переменную окружения AIGATE_TOKEN.
token =

# Имя интеграции, если ключ к ней не привязан.
integration =

# Корпоративный корневой сертификат (PEM). insecure = true отключает проверку TLS, только для стенда.
ca_file =
insecure = false

# Начните с одного запроса: у модельного детектора может быть один worker.
# Увеличивайте jobs по доступной мощности, а не по размеру набора.
# Далее таймаут одного запроса в секундах и повторы при 429/5xx.
jobs = 1
timeout = 60
retries = 8

# Дополнительные заголовки каждого запроса, если их требует ваш контур.
# [headers]
# X-Request-Source = aigate-eval

[pii]
# Готовая база уже включена; берутся все *.jsonl (включая вложенные).
enabled = true
folder = benchmarks/pii

[injection]
# Обнаружение промпт-инъекций: все *.jsonl из папки.
enabled = true
folder = benchmarks/injection
# preflight — без обращения к LLM; chat — как ответ инструмента агенту, нужна model.
# Для модельной проверки через preflight включите injection_model_channels.prompt.
# По умолчанию канал prompt может быть выключен, в отличие от tool_result/tool_description.
via = preflight
model =

[output]
folder = results
